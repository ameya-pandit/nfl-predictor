name: Weekly pipeline

on:
  schedule:
    # Off-peak minutes on purpose: GitHub delays or drops scheduled runs at the top of the hour.
    # Tuesday x2 and Wednesday, after Monday night games. Reruns are safe: rows are upserted.
    - cron: "17 14 * * 2"
    - cron: "43 18 * * 2"
    - cron: "17 14 * * 3"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python pipeline.py
