<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0a0a0f"/>

  <!-- Grid lines -->
  <line x1="10" y1="30" x2="90" y2="30" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="10" y1="70" x2="90" y2="70" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="30" y1="10" x2="30" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="50" y1="10" x2="50" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
  <line x1="70" y1="10" x2="70" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Trend line glow -->
  <polyline points="12,82 30,68 48,74 66,52 84,28" fill="none" stroke="#00ff88" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
  <!-- Trend line -->
  <polyline points="12,82 30,68 48,74 66,52 84,28" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data points -->
  <circle cx="30" cy="68" r="3" fill="#0a0a0f" stroke="#00ff88" stroke-width="1.5"/>
  <circle cx="66" cy="52" r="3" fill="#0a0a0f" stroke="#00ff88" stroke-width="1.5"/>

  <!-- Diamond at peak -->
  <polygon points="84,18 92,28 84,38 76,28" fill="#0a0a0f" stroke="#f0c040" stroke-width="1.5"/>
  <polygon points="84,22 89,28 84,34 79,28" fill="#f0c040"/>
</svg>
